<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUZ Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
    }

    button {
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .product {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }

    .delete {
      background: #c62828;
    }

    .edit {
      background: #555;
    }

    #adminPanel {
      display: none;
    }
  </style>
</head>

<body>

  <h1>MUZ ADMIN</h1>

  <div id="loginPanel">
    <h3>Admin Login</h3>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <p id="loginMessage"></p>
  </div>


  <div id="adminPanel">

    <button id="logoutBtn">Logout</button>

    <h2>Add Product</h2>

    <input id="productName" placeholder="Product name">

    <input id="productPrice" type="number" placeholder="Price">

    <textarea id="productDescription" placeholder="Description"></textarea>

    <input id="productImage" placeholder="Image URL">

    <button id="saveBtn">Add Product</button>

    <h2>Products</h2>

    <div id="products"></div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAjZmyWm4_p-2bWsFuYrf7BlCWJvMoFukA",
      authDomain: "muz-orginals.firebaseapp.com",
      projectId: "muz-orginals",
      storageBucket: "muz-orginals.firebasestorage.app",
      messagingSenderId: "1042601038736",
      appId: "1:1042601038736:web:cb7227d7b0cfebedbe1915",
      measurementId: "G-13ZKS78FLW"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const loginMessage = document.getElementById("loginMessage");


    document.getElementById("loginBtn").onclick = async () => {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {

        await signInWithEmailAndPassword(auth, email, password);

        loginMessage.textContent = "";

      } catch (error) {

        loginMessage.textContent = "Login failed: " + error.message;

      }

    };


    document.getElementById("logoutBtn").onclick = async () => {

      await signOut(auth);

    };


    onAuthStateChanged(auth, user => {

      if (user) {

        loginPanel.style.display = "none";
        adminPanel.style.display = "block";

        loadProducts();

      } else {

        loginPanel.style.display = "block";
        adminPanel.style.display = "none";

      }

    });


    document.getElementById("saveBtn").onclick = async () => {

      const name = document.getElementById("productName").value;
      const price = Number(document.getElementById("productPrice").value);
      const description = document.getElementById("productDescription").value;
      const image = document.getElementById("productImage").value;

      if (!name || !price) {

        alert("Please enter product name and price.");
        return;

      }

      try {

        await addDoc(collection(db, "products"), {

          name: name,
          price: price,
          description: description,
          image: image

        });

        alert("Product added!");

        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productDescription").value = "";
        document.getElementById("productImage").value = "";

        loadProducts();

      } catch (error) {

        alert("Error: " + error.message);

      }

    };


    async function loadProducts() {

      const container = document.getElementById("products");

      container.innerHTML = "Loading...";

      const snapshot = await getDocs(collection(db, "products"));

      container.innerHTML = "";

      snapshot.forEach(product => {

        const data = product.data();

        const div = document.createElement("div");

        div.className = "product";

        div.innerHTML = `
          <h3>${data.name || ""}</h3>
          <p>₹${data.price || ""}</p>
          <p>${data.description || ""}</p>
          <button class="delete">Delete</button>
        `;

        div.querySelector(".delete").onclick = async () => {

          if (confirm("Delete this product?")) {

            await deleteDoc(doc(db, "products", product.id));

            loadProducts();

          }

        };

        container.appendChild(div);

      });

    }

  </script>

</body>
  </html>
